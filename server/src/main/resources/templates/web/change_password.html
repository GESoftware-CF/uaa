<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <th:block layout:insert="~{nav :: head}"></th:block>
    <script th:src="@{/resources/predix/js/toast-notifications.js}" defer="defer"></script>
</head>
<div layout:fragment="page-nav">
    <th:block layout:replace="~{nav :: nav}"></th:block>
</div>
<div class="island" layout:fragment="page-content">
    <h1>Change Password</h1>
    <div class="island-content">
        <form th:action="@{/change_password.do}" method="post" novalidate="novalidate">
            <div th:replace="~{fragments/toast :: errorMessage(${message})}"></div>
            <div th:replace="~{fragments/toast :: errorCode('change_password', ${message_code})}"></div>
            <input name="current_password" type="password" aria-label="Current password" autocomplete="off" autofocus="autofocus" class="form-control"/>
            <input name="new_password" type="password" aria-label="New password" autocomplete="off" class="form-control"/>
            <input name="confirm_password" type="password" aria-label="Confirm new password" autocomplete="off" class="form-control"/>
            <input type="submit" value="Change password" class="island-button"/>
        </form>
    </div>
</div>
</html>
