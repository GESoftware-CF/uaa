<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <script th:src="@{/resources/predix/js/toast-notifications.js}" defer="defer"></script>
</head>
<div class="island" layout:fragment="page-content">
    <h1>Reset password</h1>
    <div class="island-content">
        <div th:text="|Username: ${username}|" class="email-display">Username: user@example.com</div>
        <form th:action="@{/reset_password.do}" method="post" novalidate="novalidate">
            <input type="hidden" name="code" th:value="${code}"/>
            <input type="hidden" name="email" th:value="${email}"/>
            <input type="hidden" name="username" th:value="${username}"/>
            <div th:replace="~{fragments/toast :: errorCode('reset_password', ${message_code})}"></div>
            <div th:replace="~{fragments/toast :: errorMessage(${message})}"></div>
            <label>New password</label>
            <input name="password" type="password" aria-label="New Password" autocomplete="off" class="form-control"/>
            <label>Confirm password</label>
            <input name="password_confirmation" type="password"  aria-label="Confirm New Password" autocomplete="off" class="form-control"/>
            <input type="submit" value="Create new password" class="island-button"/>
        </form>
    </div>
</div>
</html>
