# Sample configuration for background image service
# Add this to your uaa.yml or application.yml

background-image:
  # Enable/disable the background image feature
  enabled: true
  
  storage:
    # AWS S3 bucket for storing background images
    # Required - no default value
    bucket: ${AWS_S3_BUCKET}
    
    # S3 key prefix (folder path)
    # Default: media
    key-prefix: media
  
  validation:
    # Minimum file size in bytes (10 KB)
    min-size-bytes: 10240
    
    # Maximum file size in bytes (10 MB)
    max-size-bytes: 10485760
    
    # Allowed MIME types (detected via magic-byte analysis)
    allowed-mime-types:
      - image/png
      - image/jpeg
      - image/webp

# AWS Configuration
aws:
  # AWS region for S3
  region: ${AWS_REGION:us-east-1}
  
  s3:
    # Max concurrent S3 connections (CRT HTTP client)
    max-concurrency: 50
    
    # File size threshold for switching to multipart upload (8 MB)
    multipart-threshold-bytes: 8388608

# Spring Boot multipart configuration
spring:
  servlet:
    multipart:
      # Max file size per request
      max-file-size: 11MB
      
      # Max total request size
      max-request-size: 12MB
      
      # Enable multipart support
      enabled: true

# Logging (optional - for debugging)
logging:
  level:
    org.cloudfoundry.identity.uaa.media: DEBUG
    software.amazon.awssdk: INFO
