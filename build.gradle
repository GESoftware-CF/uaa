jacocoTestReport {
    additionalSourceDirs(files(sourceSets.main.allSource.srcDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    classDirectories.setFrom(files(sourceSets.main.output))
    executionData(files("${buildDir}/jacoco/test.exec"))
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

task jacocoRootReport(type: org.gradle.testing.jacoco.tasks.JacocoReport) {
    // Don't depend on tests - assume they've already run
    // This allows running the report generation independently

    additionalSourceDirs.from files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.from files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.from files(subprojects.sourceSets.main.output)

    // Collect all execution data files from build directories
    executionData.from fileTree(dir: '.', include: '**/build/jacoco/*.exec')

    reports {
        xml.required.set(true)
        html.required.set(true)
        xml.outputLocation.set(file("${buildDir}/reports/jacoco/jacocoRootReport/jacocoRootReport.xml"))
        html.outputLocation.set(file("${buildDir}/reports/jacoco/jacocoRootReport/html"))
    }

    doFirst {
        // Log the execution data files found (for debugging)
        def execFiles = executionData.files.findAll { it.exists() }
        println "Jacoco execution data files found: ${execFiles.size()}"
        execFiles.each { println "  - ${it}" }
    }
}