    repositories {
        maven {
            credentials {
                username System.getenv('ARTIFACTORY_CREDENTIALS_USR')
                password System.getenv('ARTIFACTORY_CREDENTIALS_PSW')
            }
            url 'https://gart.software.gevernova.com/artifactory/pgog-fss-iam-uaa-mvn-virtual'
        }
        gradlePluginPortal()
        maven {
            url("https://plugins.gradle.org/m2/")
        }
    }

    dependencies {
        classpath(libraries.cargoGradlePlugin)
        classpath(libraries.springDependencyMangementGradlePlugin)
        classpath(libraries.springBootGradlePlugin)
